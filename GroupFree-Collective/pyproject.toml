[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gfc"
version = "0.1.0"
description = "Group-Free Symmetric Collectives — Triton runtime for subgroup collectives over PyTorch Symmetric Memory"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "GroupFree-Collective" }]
dependencies = [
    "torch>=2.10",
    "triton>=3.6",
]

[tool.setuptools.packages.find]
include = ["gfc*"]
exclude = ["tests*", "benchmarks*", "docs*"]

[tool.pytest.ini_options]
# GFC's own pytest config: stops pytest from picking up the settings of an
# enclosing repository (e.g. vLLM-Omni's asyncio_mode / --strict-config) when the
# tests run from a vendored copy.
testpaths = ["tests"]
